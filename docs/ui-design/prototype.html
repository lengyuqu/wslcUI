<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>wslcUI — 界面设计原型 v2</title>
<style>
:root{
  --bg-app:#1f1f1f; --bg-card:#2b2b2b; --bg-elev:#333333; --bg-hover:#ffffff0d; --bg-sel:#ffffff14;
  --stroke:#3d3d3d; --stroke-strong:#525252;
  --fg:#f3f3f3; --fg-2:#c2c2c2; --fg-3:#8a8a8a;
  --accent:#4cc2ff; --accent-soft:#0e3a52; --accent-fg:#00263b;
  --ok-fg:#6ccb8f; --ok-bg:#173528; --ok-bd:#2f6b48;
  --stop-fg:#a6a6a6; --stop-bg:#333333; --stop-bd:#4d4d4d;
  --busy-fg:#7fc7ff; --busy-bg:#123246; --busy-bd:#2c6d94;
  --build-fg:#f0c674; --build-bg:#3a2f16; --build-bd:#7a6029;
  --err-fg:#f1707d; --err-bg:#40212a; --err-bd:#8a3140;
  --r-sm:4px; --r-md:6px; --r-lg:8px; --r-xl:12px;
  --font:"Segoe UI Variable Text","Segoe UI",-apple-system,"Microsoft YaHei UI","PingFang SC",sans-serif;
  --mono:"Cascadia Mono","Consolas","Sarasa Mono SC",monospace;
}
html[data-theme="light"]{
  --bg-app:#f3f3f3; --bg-card:#ffffff; --bg-elev:#fafafa; --bg-hover:#00000008; --bg-sel:#0000000f;
  --stroke:#e2e2e2; --stroke-strong:#c8c8c8;
  --fg:#1b1b1b; --fg-2:#4a4a4a; --fg-3:#767676;
  --accent:#0078d4; --accent-soft:#e6f2fb; --accent-fg:#ffffff;
  --ok-fg:#0f6e3f; --ok-bg:#e7f5ec; --ok-bd:#8ed3ab;
  --stop-fg:#5a5a5a; --stop-bg:#f0f0f0; --stop-bd:#cfcfcf;
  --busy-fg:#0b5c8a; --busy-bg:#e6f2fb; --busy-bd:#8ec7ec;
  --build-fg:#8a5a00; --build-bg:#fdf3dd; --build-bd:#e0b458;
  --err-fg:#a4262c; --err-bg:#fdeced; --err-bd:#f0a4ac;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;font-family:var(--font);color:var(--fg);display:flex;justify-content:center;padding:16px;-webkit-font-smoothing:antialiased}
.shell{width:100%;max-width:1440px;height:calc(100vh - 32px);min-height:760px;background:var(--bg-app);border:1px solid var(--stroke);border-radius:var(--r-xl);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 64px #0008}

/* ---------- 标题栏 ---------- */
.titlebar{height:40px;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid var(--stroke);flex:0 0 auto}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.brand .sub{font-weight:400;color:var(--fg-3);font-size:12px}
.tb-spacer{flex:1}
.chip{border:1px solid var(--stroke-strong);background:transparent;color:var(--fg-2);border-radius:var(--r-sm);padding:3px 9px;font-size:12px;cursor:pointer;font-family:inherit}
.chip:hover{background:var(--bg-hover);color:var(--fg)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.demo{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--fg-3)}

/* ---------- 主体三栏 ---------- */
.body{flex:1;display:grid;grid-template-columns:220px minmax(0,1fr) 340px;min-height:0}
body[data-nav="collapsed"] .body{grid-template-columns:56px minmax(0,1fr) 340px}
body[data-detail="hidden"] .body{grid-template-columns:220px minmax(0,1fr) 0}
body[data-nav="collapsed"][data-detail="hidden"] .body{grid-template-columns:56px minmax(0,1fr) 0}

/* ---------- 导航 ---------- */
.nav{background:var(--bg-elev);border-right:1px solid var(--stroke);padding:8px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.nav-item{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-md);cursor:pointer;font-size:13px;color:var(--fg-2);border:1px solid transparent;white-space:nowrap}
.nav-item:hover{background:var(--bg-hover);color:var(--fg)}
.nav-item.active{background:var(--bg-sel);color:var(--fg);border-color:var(--stroke)}
.nav-item.active::before{content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:16px;border-radius:2px;background:var(--accent)}
.nav-item svg{flex:0 0 16px}
.nav-item .count{margin-left:auto;font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.nav-sep{height:1px;background:var(--stroke);margin:8px 6px}
.nav-foot{margin-top:auto;font-size:11px;color:var(--fg-3);padding:8px 10px;line-height:1.5}
body[data-nav="collapsed"] .nav-item .label,body[data-nav="collapsed"] .nav-item .count,body[data-nav="collapsed"] .nav-foot{display:none}
body[data-nav="collapsed"] .nav-item{justify-content:center}

/* ---------- 内容区 ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.cmdbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--stroke);flex:0 0 auto;flex-wrap:wrap}
.page-title{font-size:15px;font-weight:600}
.search{display:flex;align-items:center;gap:6px;background:var(--bg-card);border:1px solid var(--stroke-strong);border-radius:var(--r-md);padding:5px 10px;width:220px}
.search input{border:0;background:transparent;outline:0;color:var(--fg);font-family:inherit;font-size:12.5px;width:100%}
.search input::placeholder{color:var(--fg-3)}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-md);border:1px solid var(--stroke-strong);background:var(--bg-card);color:var(--fg);padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--bg-hover)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--err-fg);border-color:var(--err-bd)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--bg-hover);border-color:var(--stroke)}
.btn.sm{padding:4px 9px;font-size:12px}
.spacer{flex:1}
.meta{font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}

/* ---------- 列表 ---------- */
.scroll{flex:1;overflow:auto;min-height:0}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;z-index:2;background:var(--bg-app);text-align:left;font-size:11.5px;font-weight:600;color:var(--fg-3);padding:8px 12px;border-bottom:1px solid var(--stroke);cursor:pointer;user-select:none;white-space:nowrap}
thead th:hover{color:var(--fg)}
thead th .arrow{opacity:0;margin-left:3px;font-size:9px}
thead th.sorted .arrow{opacity:1;color:var(--accent)}
tbody td{padding:9px 12px;border-bottom:1px solid var(--stroke);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--bg-hover)}
tbody tr.sel{background:var(--bg-sel);box-shadow:inset 2px 0 0 var(--accent)}
.mono{font-family:var(--mono);font-size:12px}
.strong{font-weight:600}
.dim{color:var(--fg-3)}
.row-actions{opacity:0;display:flex;gap:4px;justify-content:flex-end}
tr:hover .row-actions,tr.sel .row-actions{opacity:1}
.bar{display:inline-block;width:52px;height:4px;border-radius:2px;background:var(--stroke);overflow:hidden;vertical-align:middle;margin-left:6px}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.hot>i{background:var(--err-fg)}

/* ---------- 徽章 ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;border:1px solid;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-fg)}
.b-stop{background:var(--stop-bg);border-color:var(--stop-bd);color:var(--stop-fg)}
.b-busy{background:var(--busy-bg);border-color:var(--busy-bd);color:var(--busy-fg)}
.b-build{background:var(--build-bg);border-color:var(--build-bd);color:var(--build-fg)}
.b-err{background:var(--err-bg);border-color:var(--err-bd);color:var(--err-fg)}

/* ---------- 状态区 ---------- */
.infobar{margin:10px 14px 0;display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:var(--r-md);border:1px solid var(--err-bd);background:var(--err-bg);color:var(--fg);font-size:12.5px}
.infobar.info{border-color:var(--accent);background:var(--accent-soft)}
.infobar .msg{flex:1;line-height:1.5}
.skel{padding:0 12px}
.skel-row{height:38px;border-bottom:1px solid var(--stroke);display:flex;align-items:center;gap:12px}
.skel-bar{height:9px;border-radius:4px;background:linear-gradient(90deg,var(--bg-elev),var(--stroke),var(--bg-elev));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:48px 24px;text-align:center;color:var(--fg-3)}
.empty h3{font-size:14px;font-weight:600;color:var(--fg-2)}
.empty p{font-size:12.5px;max-width:380px;line-height:1.6}

/* ---------- 指标卡 ---------- */
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:12px 14px}
.metric{background:var(--bg-card);border:1px solid var(--stroke);border-radius:var(--r-lg);padding:12px 14px}
.metric .k{font-size:11.5px;color:var(--fg-3)}
.metric .v{font-size:22px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.metric .d{font-size:11.5px;color:var(--fg-3);margin-top:2px}

/* ---------- 详情面板 ---------- */
.detail{background:var(--bg-elev);border-left:1px solid var(--stroke);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.d-head{padding:14px;border-bottom:1px solid var(--stroke)}
.d-kicker{font-size:11px;color:var(--fg-3);text-transform:none}
.d-title{font-size:15px;font-weight:600;margin-top:3px;word-break:break-all;line-height:1.35}
.d-badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.d-body{padding:6px 14px 14px;overflow:auto;flex:1}
.d-section{margin-top:14px}
.d-section h4{font-size:11.5px;color:var(--fg-3);font-weight:600;margin-bottom:6px;letter-spacing:.02em}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:12.5px;border-bottom:1px solid var(--stroke)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--fg-3);flex:0 0 auto}
.kv .v{text-align:right;word-break:break-all;color:var(--fg-2)}
.d-foot{padding:12px 14px;border-top:1px solid var(--stroke);display:flex;flex-direction:column;gap:6px}
.d-foot .row{display:flex;gap:6px}
.d-foot .row .btn{flex:1;justify-content:center}

/* ---------- 日志抽屉 ---------- */
.drawer{border-top:1px solid var(--stroke);background:var(--bg-card);flex:0 0 auto;height:36px;display:flex;align-items:center;gap:10px;padding:0 14px;cursor:pointer}
.drawer .caret{transition:transform .15s;color:var(--fg-3)}
body[data-log="open"] .drawer .caret{transform:rotate(90deg)}
.drawer .t{font-size:12.5px;font-weight:600}
.drawer .hint{font-size:11.5px;color:var(--fg-3)}
.logpane{height:0;overflow:hidden;background:#161616;border-top:1px solid var(--stroke);transition:height .18s ease}
body[data-log="open"] .logpane{height:230px}
.logpane pre{font-family:var(--mono);font-size:12px;line-height:1.65;color:#d6d6d6;padding:12px 14px;overflow:auto;height:100%;white-space:pre-wrap}
.logpane .lvl-err{color:#ff9aa2}.logpane .lvl-warn{color:#f0c674}.logpane .lvl-ok{color:#8ddcae}.logpane .ts{color:#6f6f6f}

/* ---------- 状态栏 ---------- */
.statusbar{height:28px;display:flex;align-items:center;gap:14px;padding:0 14px;border-top:1px solid var(--stroke);font-size:11.5px;color:var(--fg-3);flex:0 0 auto}
.statusbar .ok-dot{width:6px;height:6px;border-radius:50%;background:var(--ok-fg)}

/* ---------- 对话框 ---------- */
.scrim{position:absolute;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:20}
.scrim.show{display:flex}
.dialog{background:var(--bg-card);border:1px solid var(--stroke-strong);border-radius:var(--r-xl);width:420px;box-shadow:0 32px 64px #000a;overflow:hidden}
.dialog .d-body{padding:20px}
.dialog h3{font-size:15px;font-weight:600;margin-bottom:8px}
.dialog p{font-size:13px;color:var(--fg-2);line-height:1.6}
.dialog .d-foot{flex-direction:row;justify-content:flex-end;gap:8px;padding:14px 20px;background:var(--bg-elev);border-top:1px solid var(--stroke)}
.dialog .d-foot .btn{min-width:96px;justify-content:center}

/* ---------- 构建页 ---------- */
.build-wrap{flex:1;display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.form{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--stroke);flex-wrap:wrap}
.field{display:flex;align-items:center;gap:6px;background:var(--bg-card);border:1px solid var(--stroke-strong);border-radius:var(--r-md);padding:5px 10px}
.field label{font-size:11.5px;color:var(--fg-3);white-space:nowrap}
.field input{border:0;background:transparent;outline:0;color:var(--fg);font-family:inherit;font-size:12.5px;width:260px}
.term{flex:1;overflow:auto;background:#161616;padding:12px 14px;font-family:var(--mono);font-size:12px;line-height:1.7;color:#d6d6d6;white-space:pre-wrap;min-height:0}
.term .step{color:#4cc2ff}.term .ok{color:#8ddcae}.term .warn{color:#f0c674}.term .dim{color:#6f6f6f}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

      <div class="nav-foot">wslc 2.9.9<br>SDK + CLI bridge</div>
    </nav>

    <main class="main" id="main">
      <div class="cmdbar" id="cmdbar"></div>
      <div class="scroll" id="content"></div>
    </main>

    <aside class="detail" id="detail"></aside>
  </div>

  <!-- 日志抽屉 -->
  <div class="drawer" id="drawer">
    <svg class="caret" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3l5 5-5 5"/></svg>
    <span class="t">日志</span>
    <span class="hint" id="drawerHint">点击展开 · 选中对象后按 L 载入</span>
    <div class="spacer"></div>
    <span class="hint" id="drawerTarget">未选择对象</span>
  </div>
  <div class="logpane"><pre id="logText"></pre></div>

  <!-- 状态栏 -->
  <div class="statusbar">
    <span class="ok-dot"></span><span id="sbStatus">就绪</span>
    <span class="spacer"></span>
    <span id="sbCount">—</span>
    <span>wslc 2.9.9</span>

  <!-- 对话框 -->
  <div class="scrim" id="scrim">
    <div class="dialog" role="dialog" aria-modal="true">
      <div class="d-body"><h3 id="dlgTitle">确认</h3><p id="dlgMsg"></p></div>
      <div class="d-foot"><button class="btn" id="dlgCancel">取消</button><button class="btn primary" id="dlgOk">确认</button></div>
    </div>
  </div>
</div>

  sel:{containers:null, images:null, networks:null, volumes:null, stats:null},

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => { const m = parseFloat(String(v).replace(/[^\d.]/g,"")); return isNaN(m) ? 0 : m; };

function rowsFor(page){
  if(page === "build") return [];
  const list = DATA[page] || [];
  const q = state.query.trim().toLowerCase();
  let rows = list.filter(r => !q || Object.values(r).some(v => String(v).toLowerCase().includes(q)));
  const [key, dir] = state.sort[page] || ["name", 1];
  rows = rows.slice().sort((a,b) => {
    const av = a[key], bv = b[key];
    if(av === undefined) return 0;
    if(typeof av === "number" || (av !== "" && !isNaN(num(av)) && /[\d.]/.test(String(av))) && key !== "name" && key !== "repo"){
      return (num(av) - num(bv)) * dir;
    }
    return String(av).localeCompare(String(bv), "zh-CN") * dir;
  });
  return rows;
}

function renderContent(){
  const host = $("#content");
  if(state.page === "build"){ renderBuild(host); return; }
  if(state.view === "loading"){ renderSkeleton(host); return; }

  const rows = rowsFor(state.page);
  if(!rows.length){ renderEmpty(host); return; }
  renderTable(host, rows);
}

function renderTable(host, rows){
  const p = PAGES[state.page];
  const [sk, sd] = state.sort[state.page] || ["name",1];
  const grid = p.cols.map(c => c.w).join(" ");
  const head = p.cols.map(c => c.k === "_act"
    ? `<th style="cursor:default"></th>`
    : `<th data-sort="${c.k}" class="${c.k === sk ? "sorted" : ""}" style="width:${c.w}">${esc(c.t)}<span class="arrow">${c.k === sk ? (sd > 0 ? "▲" : "▼") : "▲"}</span></th>`).join("");
  const body = rows.map(r => {
    const tds = p.cols.map(c => {
      const v = r[c.k];
      if(c.k === "_act"){
        const acts = state.page === "containers"
          ? [{l:"日志",a:"logs"},{l:"终端",a:"term"}]
          : [{l:"删除",a:"del"}];
        return `<td><div class="row-actions">${acts.map(a => `<button class="btn sm ghost" data-act="${a.a}" data-id="${r.id}">${a.l}</button>`).join("")}</div></td>`;
      }
      if(c.k === "status"){
        const s = STATUS[v] || STATUS.stopped;
        return `<td><span class="badge ${s.cls}"><span class="dot"></span>${s.label}</span></td>`;
      }
      if(c.k === "cpu"){
        const n = num(v);
        return `<td><span class="mono">${n.toFixed(0)}%</span><span class="bar${n > 50 ? " hot" : ""}"><i style="width:${Math.min(100,n)}%"></i></span></td>`;
      }
      if(c.k === "memPct"){
        const n = num(v);
        return `<td><span class="mono">${n.toFixed(0)}%</span><span class="bar${n > 80 ? " hot" : ""}"><i style="width:${Math.min(100,n)}%"></i></span></td>`;
      }
      if(c.k === "name" || c.k === "repo"){
        return `<td class="strong">${esc(v)}</td>`;
      }
      if(c.k === "tag" || c.k === "digest" || c.k === "mount" || c.k === "subnet" || c.k === "ports"){
        return `<td class="mono dim">${esc(v)}</td>`;
      }
      if(c.k === "size" || c.k === "mem" || c.k === "net" || c.k === "block" || c.k === "pids" || c.k === "attached" || c.k === "containers"){
        return `<td class="mono">${esc(v)}</td>`;
      }
      return `<td class="dim">${esc(v)}</td>`;
    }).join("");
    const sel = state.sel[state.page] === r.id ? " sel" : "";
    return `<tr class="${sel.trim()}" data-id="${r.id}">${tds}</tr>`;
  }).join("");
  host.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

  if(state.page === "stats"){
    const hot = row.cpu > 50;
    badges = `<span class="badge ${hot ? "b-err" : "b-ok"}"><span class="dot"></span>${hot ? "高负载" : "正常"}</span>`;
    body = `<div class="d-section"><h4>资源快照</h4>
        ${kv("CPU", `<span class="mono">${row.cpu}%</span>`)}${kv("内存", `<span class="mono">${row.mem}</span> <span class="dim">(${row.memPct}%)</span>`)}
        ${kv("网络 I/O", `<span class="mono">${row.net}</span>`)}${kv("块 I/O", `<span class="mono">${row.block}</span>`)}${kv("PID 数", row.pids)}
      </div>
      <div class="d-section"><p style="font-size:11.5px;color:var(--fg-3);line-height:1.6">wslc stats 为一次性快照，不会自动刷新。建议每 5 秒手动刷新或开启轮询。</p></div>`;
    foot = [`<div class="row"><button class="btn primary" data-act="refresh-stats">刷新快照</button></div>`,
            `<div class="row"><button class="btn" data-act="logs">查看日志</button></div>`];
  }

  host.innerHTML = detailShell(P.title, row.name || row.repo, badges, body, foot);
  $("#drawerTarget").textContent = row.name || `${row.repo}:${row.tag}`;
}

function detailShell(kicker, title, badges, body, foot){
  return `<div class="d-head">
      <div class="d-kicker">${esc(kicker)} · 详情</div>
      <div class="d-title">${esc(title)}</div>
      <div class="d-badges">${badges}</div>
    </div>
    <div class="d-body">${body}</div>
    <div class="d-foot">${foot.join("")}</div>`;
}
function kv(k, v, mono){
  return `<div class="kv"><span class="k">${esc(k)}</span><span class="v${mono ? " mono" : ""}">${v}</span></div>`;
}

function renderStatusbar(){
  const n = state.page === "build" ? "构建就绪" : `${rowsFor(state.page).length} 个${PAGES[state.page].title}`;
  const txt = state.view === "loading" ? "正在同步…" : state.view === "error" ? "后端不可用" : "就绪";
  $("#sbStatus").textContent = txt;
  $("#sbCount").textContent = n;
}

/* ============ 交互 ============ */
document.addEventListener("click", e => {
  const nav = e.target.closest(".nav-item");
  if(nav){
    state.page = nav.dataset.page;
    state.query = "";
    render();
    return;
  }
  const th = e.target.closest("th[data-sort]");
  if(th){
    const k = th.dataset.sort;
    const cur = state.sort[state.page];
    state.sort[state.page] = cur && cur[0] === k ? [k, -cur[1]] : [k, 1];
    renderContent();
    return;
  }
  const tr = e.target.closest("tbody tr[data-id]");
  if(tr && !e.target.closest("button")){
    state.sel[state.page] = tr.dataset.id;
    const row = DATA[state.page].find(r => r.id === tr.dataset.id);
    if(row) state.logTarget = row.name || `${row.repo}:${row.tag}`;
    renderContent();
    renderDetail();
    renderStatusbar();
    return;
  }
  const btn = e.target.closest("[data-act]");
  if(btn) handleAct(btn.dataset.act, btn);
});

document.addEventListener("dblclick", e => {
  const tr = e.target.closest("tbody tr[data-id]");
  if(tr && state.page === "containers") handleAct("term");
});

document.addEventListener("input", e => {
  if(e.target.id === "q"){ state.query = e.target.value; renderContent(); renderStatusbar(); }
});

document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ $("#scrim").classList.remove("show"); return; }
  if(e.target.tagName === "INPUT") return;
  if(e.key === "/"){ const q = $("#q"); if(q){ e.preventDefault(); q.focus(); } }
  if(e.key.toLowerCase() === "l"){ toggleLog(true); }
  if(e.key.toLowerCase() === "r" && !e.metaKey && !e.ctrlKey){ runRefresh(); }
});

function handleAct(act, el){
  const P = PAGES[state.page];
  const id = state.sel[state.page];
  const row = (DATA[state.page] || []).find(r => r.id === id);

  switch(act){
    case "refresh": runRefresh(); break;
    case "refresh-stats": runRefresh("资源快照已更新"); break;
    case "logs": {
      if(row) state.logTarget = row.name || `${row.repo}:${row.tag}`;
      toggleLog(true);
      break;
    }
    case "term": toast("已为 " + (row ? row.name : "选中容器") + " 打开 ConPTY 终端窗口"); break;
    case "start": if(row){ row.status = "running"; render(); toast(`${row.name} 已启动`); } break;
    case "stop": if(row){ row.status = "stopped"; render(); toast(`${row.name} 已停止`); } break;
    case "restart": toast(`正在重启 ${row ? row.name : "容器"}…`); break;
    case "run": toast(`正在从 ${row ? row.repo + ":" + row.tag : "镜像"} 创建容器`); break;
    case "inspect": toast("层信息面板将在实现阶段补齐"); break;
    case "browse": toast("已打开文件夹选择对话框"); break;
    case "clear-log": toast("输出已清空"); break;
    case "build": toast("构建任务已提交，输出实时追加"); break;
    case "create":
      promptDlg("新建" + P.title, `为新的${P.title}输入一个名称。名称只能包含小写字母、数字与连字符。`, "my-" + (state.page === "volumes" ? "volume" : "network"), v => toast(`已创建 ${v}`));
      break;
    case "fill-pull":
      state.page = "images"; state.query = ""; state.view = "normal";
      render(); toast(`已填入镜像引用 ${state.pullRef}`);
      break;
    case "fill-tag": {
      const t = $("#tag"); if(t) t.value = el.dataset.tag; toast("标签已填入");
      break;
    }
    case "del": {
      if(!row) break;
      const name = row.name || `${row.repo}:${row.tag}`;
      confirmDlg(`删除${P.title}`, `确定删除「${name}」吗？此操作不可撤销，相关数据将一并移除。`, () => {
        DATA[state.page] = DATA[state.page].filter(r => r.id !== id);
        state.sel[state.page] = null;
        render();
        toast(`${name} 已删除`);
      });
      break;
    }
    default: toast(`动作：${act}`);
  }
}

function runRefresh(msg){
  state.view = "loading";
  renderContent(); renderStatusbar();
  setTimeout(() => { state.view = "normal"; render(); toast(msg || "列表已刷新"); }, 900);
}

function toggleLog(force){
  state.logOpen = force === true ? true : !state.logOpen;
  document.body.dataset.log = state.logOpen ? "open" : "closed";
  if(state.logOpen){
    const t = state.logTarget || "nginx-proxy";
    $("#logText").innerHTML = LOG_SAMPLES[t] ||
      `[2026-08-28 14:02:11] <span class="ts">wslc logs ${esc(t)}</span>\n<span class="lvl-ok">[ok]</span> 已附加到容器输出流（快照模式，非跟随）。\n<span class="dim">提示：wslc logs 不支持 -f 跟随，需要实时输出请打开终端。</span>`;
    $("#drawerHint").textContent = "按 L 收起 · 双击行打开终端";
  } else {
    $("#drawerHint").textContent = "点击展开 · 选中对象后按 L 载入";
  }
}

$("#drawer").addEventListener("click", () => toggleLog());

document.querySelectorAll("[data-demo]").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("[data-demo]").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  state.view = b.dataset.demo === "normal" ? "normal" : b.dataset.demo;
  renderContent();
  renderStatusbar();
}));

$("#themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme !== "light";
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  $("#themeBtn").textContent = dark ? "深色主题" : "亮色主题";
});

/* 对话框 + toast */
let dlgCb = null;
function openDlg(title, msg, okLabel, danger, cb){
  $("#dlgTitle").textContent = title;
  $("#dlgMsg").innerHTML = msg;
  const ok = $("#dlgOk");
  ok.textContent = okLabel;
  ok.className = "btn " + (danger ? "danger" : "primary");
  dlgCb = cb;
  $("#scrim").classList.add("show");
  ok.focus();
}
function confirmDlg(t, m, cb){ openDlg(t, esc(m), "删除", true, cb); }
function promptDlg(t, m, def, cb){
  openDlg(t, esc(m) + `<div style="margin-top:10px"><input id="dlgInput" value="${esc(def)}" style="width:100%;padding:6px 10px;border-radius:6px;border:1px solid var(--stroke-strong);background:var(--bg-elev);color:var(--fg);font-family:inherit;font-size:13px;outline:0" /></div>`, "创建", false, () => {
    const v = ($("#dlgInput") || {}).value || def; cb(v);
  });
}
$("#dlgCancel").addEventListener("click", () => $("#scrim").classList.remove("show"));
$("#scrim").addEventListener("click", e => { if(e.target.id === "scrim") $("#scrim").classList.remove("show"); });
$("#dlgOk").addEventListener("click", () => { $("#scrim").classList.remove("show"); if(dlgCb){ const c = dlgCb; dlgCb = null; c(); } });

let toastTimer = null;
function toast(msg){
  const sb = $("#sbStatus");
  sb.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => renderStatusbar(), 2200);
}

render();
</script>
</body>
</html>
